<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Everyday Cool Arcade — Kids Edition</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #2456a6;
    color: #ffffff;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 24px;
    cursor: pointer;
    overflow: hidden;
  }
  .art {
    max-width: min(880px, 92vw);
    width: 100%;
    height: auto;
    border: 4px solid #ffffff;
    border-radius: 20px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
  }
  h1 {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(30px, 4.5vw, 46px);
    line-height: 1.05;
    text-align: center;
  }
  .pill {
    display: inline-block;
    background: #ffffff;
    color: #2456a6;
    border-radius: 999px;
    padding: 5px 16px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .hint {
    margin: 0;
    font-size: 16px;
    opacity: 0.92;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
</style>
</head>
<body>
  <img class="art" src="bulldog-arcade.webp" alt="A gray bulldog in a royal blue jersey playing an arcade cabinet beside a friendly robot at a pinball machine.">
  <h1>Everyday Cool Arcade</h1>
  <span class="pill">Kids Edition · Go Bulldogs</span>
  <p class="hint">Tap anywhere to play</p>
<script>
  var gone = false;
  function enter() {
    if (gone) return;
    gone = true;
    window.location.href = 'index.html';
  }
  window.addEventListener('load', function () { setTimeout(enter, 6000); });
  document.addEventListener('click', enter);
  document.addEventListener('keydown', enter);
</script>
</body>
</html>
